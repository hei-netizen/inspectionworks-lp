<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Takk! | Inspection Works</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#F3F5F8;--ink:#101C2E;--muted:#5B6878;--line:#DDE3EA;--clay:#E99840;--clay-deep:#A85E12;--gold:#E99840}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.wordmark{font-size:1.32rem;letter-spacing:.42em;text-indent:.42em;font-weight:600;margin-bottom:6px}
.stars{color:var(--gold);letter-spacing:1px;font-size:0.95rem;margin-bottom:38px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(26,21,19,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#15253C}
h1{font-weight:800;font-size:1.7rem;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.hint{margin-top:18px;font-size:0.85rem}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:0.9rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px;transition:.2s}
.back:hover{border-color:var(--clay);color:var(--clay)}
.callbox{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.callbox .lede{font-size:0.95rem;color:var(--ink);font-weight:600;margin-bottom:14px}
.call{display:inline-flex;align-items:center;gap:10px;background:var(--clay);color:#fff;text-decoration:none;font-weight:800;font-size:1.12rem;letter-spacing:.01em;border-radius:999px;padding:16px 30px;box-shadow:0 12px 26px -14px rgba(180,99,77,.9);transition:.2s}
.call:hover{background:var(--clay-deep);transform:translateY(-1px)}
.call svg{width:19px;height:19px;fill:#fff}
.sms{display:inline-flex;align-items:center;gap:9px;color:var(--clay-deep);text-decoration:none;font-weight:700;font-size:0.95rem;border:1px solid var(--line);border-radius:999px;padding:13px 26px;transition:.2s}
.sms:hover{border-color:var(--clay);color:var(--clay)}
.hours{margin-top:14px;font-size:0.82rem;color:var(--muted)}
.logo{height:34px;width:auto;margin:0 auto 34px;background:#15253C;padding:14px 22px;box-sizing:content-box;border-radius:14px}
.logo{height:34px;width:auto;margin:0 auto 34px;background:#15253C;padding:14px 22px;box-sizing:content-box;border-radius:14px}
</style>
</head>
<body>
  <img class="logo" src="img/logo-hvit.png" alt="Inspection Works">
  <div class="card">
    <span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>Takk! Vi har mottatt henvendelsen din</h1>
    <p>Andreas tar kontakt s&aring; fort som mulig for &aring; finne ut hvilket kurs som passer for deg.</p>
    <a class="back" href="https://www.inspectionworks.no">G&aring; til inspectionworks.no</a>
  </div>
</body>
</html>
